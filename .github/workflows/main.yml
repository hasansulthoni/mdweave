name: Release Build

# Pipeline ini hanya akan berjalan jika Anda membuat tag versi baru (contoh: v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # Menjalankan 3 sistem operasi secara bersamaan (paralel)
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # ==========================================
      # 1. LINUX (.deb)
      # ==========================================
      - name: Install cargo-deb (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-deb

      - name: Build .deb (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo deb

      # ==========================================
      # 2. WINDOWS (.msi)
      # ==========================================
      - name: Install WiX Toolset (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo install cargo-wix

      - name: Build .msi (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo wix --nocapture

      # ==========================================
      # 3. MACOS (.app.zip)
      # ==========================================
      - name: Install cargo-bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo install cargo-bundle

      - name: Build macOS App
        if: matrix.os == 'macos-latest'
        run: cargo bundle --release

      - name: Zip macOS App (Persiapan Upload)
        if: matrix.os == 'macos-latest'
        run: |
          cd target/release/bundle/osx
          zip -r MDWeave-macOS.zip "mdweave.app"

      # ==========================================
      # 4. UPLOAD KE GITHUB RELEASES
      # ==========================================
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/wix/*.msi
            target/release/bundle/osx/RustMarkItDown-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
